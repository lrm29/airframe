variables:
     GIT_SUBMODULE_STRATEGY: recursive
     RUNALL: ""
     FORCE: false

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        RUNALL: "yes" 
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event" && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE != "schedule"
      when: never
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'
      variables:
        RUNALL: "" 

R2024a:

    trigger:
        include:
            - local: base.yml
        strategy: depend
        forward:
            pipeline_variables: true

    variables:
        MATLAB_VERSION: R2024a
        TAGS: long-jobs

