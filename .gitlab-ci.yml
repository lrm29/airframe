variables:
     GIT_SUBMODULE_STRATEGY: recursive
     RUNALL: ""
     FORCE: 'false'

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        RUNALL: "yes" 
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'
      variables:
        RUNALL: "" 

R2024a:

    trigger:
        include:
            - local: base.yml
        strategy: depend

    variables:
        MATLAB_VERSION: R2024a
        TAGS: long-jobs

R2024b:

    trigger:
        include:
            - local: base.yml
        strategy: depend

    variables:
        MATLAB_VERSION: R2024b
        TAGS: long-jobs

R2024aLinux:

    trigger:
        include:
            - local: base.yml
        strategy: depend

    variables:
        MATLAB_VERSION: R2024a
        TAGS: linux

R2024bLinux:

    trigger:
        include:
            - local: base.yml
        strategy: depend

    variables:
        MATLAB_VERSION: R2024b
        TAGS: linux