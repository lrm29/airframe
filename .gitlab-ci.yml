variables:
     GIT_SUBMODULE_STRATEGY: recursive
     RUNALL: ""
     FORCE: false

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        RUNALL: "yes" 
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'
      variables:
        RUNALL: "" 

2024a:

    trigger:
        include:
            - local: base.yml
        strategy: depend
        forward:
            pipeline_variables: true

    variables:
        MATLAB_VERSION: 2024a
        TAGS: long-jobs

2024aLinux:

    trigger:
        include:
            - local: base.yml
        strategy: depend
        forward:
            pipeline_variables: true

    variables:
        MATLAB_VERSION: 2024a
        TAGS: mmcbroom-linux

