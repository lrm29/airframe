# Copyright 2023 The MathWorks, Inc.

variables:
  MODE: "1"
  MATLAB_LOG_FILE: "MATLAB_Log_Output.txt"

stages:
  - SingleStage
  - ByTask 
  - ByModel
  - SimulinkPipelineGeneration
  - SimulinkPipelineExecution

SingleStage:
  stage: SingleStage

  tags:
      - long-jobs

  script:
        - echo "ARCHITECTURE=padv.pipeline.Architecture.SingleStage" >> arch.env
  
  artifacts:
       reports:
         dotenv: arch.env

  rules:
        - if: $MODE == "1"

MultiStage:
  stage: ByTask

  tags:
        - long-jobs

  script:
        - echo "ARCHITECTURE=padv.pipeline.Architecture.SerialStagesGroupPerTask" >> arch.env
  
  artifacts:
       reports:
         dotenv: arch.env

  rules:
        - if: $MODE == "2"

Parallel:
  stage: ByModel

  tags:
        - long-jobs

  script:
        - echo "ARCHITECTURE=padv.pipeline.Architecture.IndependentModelPipelines_BETA" >> arch.env
  
  artifacts:
       reports:
         dotenv: arch.env
         
  rules:
        - if: $MODE == "3"

# Do not change the name of the jobs in this pipeline
SimulinkPipelineGeneration:
    
    stage: SimulinkPipelineGeneration

    tags:
        - long-jobs

    script:
    # Open the project and generate the pipeline using
    # appropriate options in project root
        - >
            mw -using BR2023ad matlab
            -nodesktop
            -logfile "$MATLAB_LOG_FILE"
            -batch "
            cp = openProject(pwd);
            generateyaml($ARCHITECTURE);
            "
  
    artifacts:
        
        paths:
        # This file is generated automatically by 
        # padv.pipeline.generatePipeline. Update this field if the 
        # name or location of the generated pipeline file is changed
            - continuous_integration

SimulinkPipelineExecution:

  stage: SimulinkPipelineExecution

  trigger:
        
    include: 
      artifact: continuous_integration/simulink_pipeline.yml
      job: SimulinkPipelineGeneration
        
    strategy: depend

  # Do not change the name of this variable
  variables:
    PADV_ROOT_PIPELINE_ID: $CI_PIPELINE_ID 