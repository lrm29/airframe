variables:
     GIT_SUBMODULE_STRATEGY: recursive
     RUNALL: ""
     FORCE: false

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        RUNALL: "yes" 
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'
      variables:
        RUNALL: "" 